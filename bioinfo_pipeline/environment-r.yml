name: rnaseq-r
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core R 4.2.3 with compatible ICU
  - r-base=4.2.3
  - icu=73.2
  - r-stringi=1.7.12
  
  # Tidyverse packages
  - r-tidyverse
  - r-dplyr
  - r-ggplot2
  
  # Excel export
  - r-openxlsx
  
  # Package management
  - r-remotes
  
  # Bioconductor core packages
  - bioconductor-biocgenerics
  - bioconductor-biobase
  - bioconductor-summarizedexperiment
  - bioconductor-s4vectors
  - bioconductor-matrixgenerics
  - bioconductor-genomeinfodb
  
  # DEG analysis (Bioconductor 3.16)
  - bioconductor-deseq2=1.38.0
  - bioconductor-edger=3.40.0
  
  # Visualization
  - bioconductor-enhancedvolcano=1.16.0
